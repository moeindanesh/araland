name: Checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: araland
          POSTGRES_PASSWORD: araland_dev
          POSTGRES_DB: araland
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U araland -d araland"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: cp .env.example .env
      - run: bun run db:generate
      - run: bun run db:deploy
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run mobile:export
