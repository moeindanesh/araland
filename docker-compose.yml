services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: araland
      POSTGRES_PASSWORD: araland_dev
      POSTGRES_DB: araland
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - araland_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U araland -d araland"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  araland_postgres:
